name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the app
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Publish Vinamp.apk to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Vinamp.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Vinamp.apk \
            --title "Vinamp – latest build" \
            --notes "On your phone, tap Vinamp.apk below to download it, then open it to install."

      - uses: actions/upload-artifact@v4
        with:
          name: Vinamp-apk
          path: Vinamp.apk
